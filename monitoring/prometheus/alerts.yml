groups:
  - name: endpoint-availability
    rules:
      - alert: ServiceDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint is unavailable: {{ $labels.instance }}"
          description: "Blackbox probing of {{ $labels.instance }} has failed continuously for at least 1 minute."

      - alert: SlowEndpoint
        expr: probe_duration_seconds{job="blackbox-http"} > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint is responding slowly: {{ $labels.instance }}"
          description: "Blackbox probing of {{ $labels.instance }} has taken more than 2 seconds continuously for at least 2 minutes."
