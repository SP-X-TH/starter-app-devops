services:
  frontend:
    build:
      context: ./frontend
    image: psu-activities-frontend:local
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Bangkok
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net

  backend:
    build:
      context: ./backend
    image: psu-activities-backend:local
    init: true
    expose:
      - "3001"
    environment:
      PORT: "3001"
      NODE_ENV: "${NODE_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${PGDATABASE:?PGDATABASE is required}"
      PGUSER: "${PGUSER:?PGUSER is required}"
      PGPASSWORD: "${PGPASSWORD:?PGPASSWORD is required}"
      PGPOOL_MAX: "${PGPOOL_MAX:-10}"
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net
      - backend_net

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${PGDATABASE:?PGDATABASE is required}"
      POSTGRES_USER: "${PGUSER:?PGUSER is required}"
      POSTGRES_PASSWORD: "${PGPASSWORD:?PGPASSWORD is required}"
      TZ: Asia/Bangkok
    volumes:
      - type: bind
        source: ./db/init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: starter-app-devops_postgres_data
