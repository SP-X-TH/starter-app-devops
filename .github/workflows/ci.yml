name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Build Docker images
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: psu-activities-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: psu-activities-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify backend runtime user
        shell: bash
        run: |
          runtime_user="$(docker image inspect psu-activities-backend:ci --format '{{.Config.User}}')"
          test -n "$runtime_user"
          test "$runtime_user" != "root"
          test "$runtime_user" != "0"
          docker run --rm --entrypoint node psu-activities-backend:ci \
            -e "if (process.getuid() === 0) process.exit(1)"

      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend:127.0.0.1 psu-activities-frontend:ci nginx -t

  compose-validation:
    name: Validate Compose stack
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGDATABASE: psu_activities
      PGUSER: app_user
      PGPASSWORD: ci_only_password_not_for_production
      NODE_ENV: test
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:8080
      APP_VERSION: ci
      PGPOOL_MAX: "10"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start Compose stack
        run: docker compose up --build -d

      - name: Wait for healthy services
        shell: bash
        run: |
          deadline=$((SECONDS + 180))
          services=(db backend frontend)

          while (( SECONDS < deadline )); do
            all_healthy=true
            for service in "${services[@]}"; do
              container_id="$(docker compose ps -q "$service")"
              if [[ -z "$container_id" ]]; then
                all_healthy=false
                continue
              fi

              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [[ "$state" == "exited" || "$state" == "dead" ]]; then
                docker compose ps
                exit 1
              fi
              if [[ "$health" != "healthy" ]]; then
                all_healthy=false
              fi
            done

            if [[ "$all_healthy" == "true" ]]; then
              exit 0
            fi
            sleep 3
          done

          docker compose ps
          exit 1

      - name: Show service status
        run: docker compose ps

      - name: Run smoke tests
        shell: bash
        run: |
          curl --fail --silent --show-error http://localhost:8080/ --output /dev/null
          curl --fail --silent --show-error http://localhost:8080/nginx-health --output /dev/null

          health_response="$(curl --fail --silent --show-error http://localhost:8080/api/health)"
          jq --exit-status '.status == "ok" and .database == "up"' <<<"$health_response" > /dev/null

          activities_response="$(curl --fail --silent --show-error http://localhost:8080/api/activities)"
          jq --exit-status '.total == 16' <<<"$activities_response" > /dev/null

          curl --fail --silent --show-error http://localhost:8080/api/categories --output /dev/null

      - name: Collect Compose logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker-compose.log 2>&1 || true

      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/docker-compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
